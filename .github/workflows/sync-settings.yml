name: Follow DAW main settings

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      retry_publish:
        description: Rebuild and retry publishing even when settings are unchanged
        type: boolean
        required: true
        default: false

concurrency:
  group: native-main-settings
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read only the official DAW main branch
        uses: actions/checkout@v4
        with:
          repository: suhina-daw/suhina-daw
          ref: main
          path: .native-source
          persist-credentials: false
          sparse-checkout: docs/guide-data
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Import committed source-approved data without executing native code
        run: node --experimental-strip-types scripts/import-main-settings.ts .native-source
      - id: changes
        run: |
          if test -z "$(git status --porcelain -- public/settings.json public/settings-source.json public/shortcuts.json public/shortcuts-source.json)"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.retry_publish)
        run: npm ci
      - if: steps.changes.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.retry_publish)
        run: npm test
      - if: steps.changes.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.retry_publish)
        run: npm run build
      - name: Record the validated source update
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/settings.json public/settings-source.json
          if test -f public/shortcuts.json; then
            git add public/shortcuts.json public/shortcuts-source.json
          fi
          git commit -m 'Sync guide data from approved DAW main exports'
          git push origin HEAD:main
      - if: steps.changes.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.retry_publish)
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  publish:
    needs: sync
    if: (needs.sync.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.retry_publish)) && vars.PAGES_SYNC_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4

  # A failed run leaves the site on old data and is easy to miss among scheduled runs. Keep one open
  # issue while runs fail, so the repository's watchers hear about it, and close it once a run passes.
  report:
    needs: [sync, publish]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: The website stopped following Suhina main
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
    steps:
      - name: Open or close the failure issue
        run: |
          open=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --jq "map(select(.title == env.TITLE))[0].number // empty")
          if test "$FAILED" = true; then
            if test -z "$open"; then
              gh issue create --title "$TITLE" --body "The **Follow DAW main settings** workflow failed, so suhina.org keeps showing the settings and shortcuts from its last successful run. Read the failing step in $RUN. A rejected export usually means Suhina changed something the website's validation does not accept yet (see the README › Where the reference content comes from). This issue closes itself when a run succeeds again."
            fi
          elif test -n "$open"; then
            gh issue close "$open" --comment "The workflow succeeded again: $RUN"
          fi
