<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Suhina is a free, open music workstation for Windows, macOS and Linux. Explore samples by sound, build songs with clips and a timeline, and work with an AI agent. Currently in pre-alpha.">
  <title>Suhina — Make music in the open</title>
  <!-- Apply a saved theme before the first paint, so a chosen theme never flashes the other one. -->
  <script>try{var t=localStorage.getItem('suhina-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="icon" type="image/svg+xml" href="/assets/brand/suhina-mark.svg">
</head>
<body>
  <div id="app"></div>
  <noscript>Suhina is a free, open music workstation for Windows, macOS and Linux, currently in pre-alpha. This website needs JavaScript. Find downloads and source code on <a href="https://github.com/suhina-daw/suhina-daw">GitHub</a>.</noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
